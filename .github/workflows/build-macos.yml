# Builds a self-contained osx-arm64 package of type!beat with Velopack (vpk), producing a .pkg
# installer + Velopack update feed, and deploys them to production (the same Hetzner box that
# hosts typebeat-web). Manual trigger only, releases are cut deliberately, not on every push.
# The sibling of build-linux.yml; read that one too, most of this is deliberately identical.
#
# ---------------------------------------------------------------------------------------------
# COST: macos-latest bills at a 10x GitHub Actions minute multiplier (a 10-minute job costs 100
# minutes of quota, vs 1x on ubuntu-latest). This is the single most expensive workflow in the
# repo. Do not put it on push/schedule, and prefer fixing a failure by reading the log over
# re-running the whole job.
#
# ---------------------------------------------------------------------------------------------
# REQUIRED GITHUB SECRETS (repo Settings -> Secrets and variables -> Actions)
#   SUBMODULE_TOKEN   Fine-grained PAT with read-only Contents on Sparpp/type-beat-assets
#                     (private). Used to clone the assets repo so typebeat.Game.Resources can be
#                     packed at the exact version the game demands. This is the SAME secret name
#                     typebeat-web's CI and build-linux.yml use; reuse the same token.
#   DEPLOY_SSH_KEY_B64  Single-line base64 of the deploy SSH private key (root@46.62.142.5).
#                     Base64 (not raw multiline) because Windows-pasted PEMs arrive CRLF-mangled
#                     -> "error in libcrypto". Secrets are PER-REPO, so having it on typebeat-web
#                     is not enough; it must exist on this repo. build-linux.yml already needs
#                     both of these, so if that workflow has ever run green, nothing to do here.
#
# ---------------------------------------------------------------------------------------------
# WHY ONE ARCHITECTURE, AND WHY arm64
#   The installed client polls a channel-less Velopack SimpleWebSource
#   (typebeat.Desktop/Updater/VelopackUpdateManager.cs), so Velopack resolves the feed name from
#   the running OS alone: releases.osx.json. One feed name per OS means one macOS artifact, so
#   publishing both osx-arm64 and osx-x64 would have the second clobber the first. arm64 is the
#   pick: every Mac shipped since late 2020 is Apple Silicon, and Rosetta 2 emulation of an x64
#   build costs exactly the frame-timing consistency a rhythm game cannot spare.
#   Adding Intel later is NOT just a second run of this workflow, it needs explicit vpk
#   --channel names (osx-arm64 / osx-x64) plus a matching ExplicitChannel in
#   VelopackUpdateManager, and a second download slot on the website. Treat it as its own task.
#
# ---------------------------------------------------------------------------------------------
# GATEKEEPER (unsigned builds)
#   Nothing here is code-signed or notarised (no Apple Developer ID on this project), so the
#   downloaded .pkg carries a com.apple.quarantine xattr and macOS will refuse it on a plain
#   double click. Users need right click -> Open, or Privacy & Security -> "Open Anyway". The
#   /download page's signing note covers this in general terms. If a Developer ID ever exists,
#   vpk grows this with --signAppIdentity / --notaryProfile and the note can go.
#
# ---------------------------------------------------------------------------------------------
# ONE-TIME SERVER CONFIG the maintainer must do for the /download page's macOS button to light up
# (the web app never forwards an undeclared host env var into the container):
#   1. typebeat-web's deploy/compose.prod.yml already declares
#          TYPEBEAT_GAME_DOWNLOAD_MACOS: "${TYPEBEAT_GAME_DOWNLOAD_MACOS:-}"
#      (added alongside this workflow). Just make sure the box is on a typebeat-web build that
#      includes it, otherwise the .env value below is silently ignored, the same footgun already
#      documented on the win and linux lines.
#   2. On the box, in /opt/typebeat-web/deploy/.env add:
#          TYPEBEAT_GAME_DOWNLOAD_MACOS=typebeat-macos.pkg
#      (this workflow always publishes the installer under that stable, un-versioned name, so the
#      value is set ONCE and never changes between releases.)
#   3. Redeploy typebeat-web (its CI, or ./deploy/up.sh up -d app) so the container picks up the env.
#      The Velopack update feed (releases.osx.json + *.nupkg under /data/downloads/releases/) is
#      served by the existing /releases/{file} route and needs no config.
#
# ---------------------------------------------------------------------------------------------
# RETENTION (the "Prune release feed" step at the bottom)
#   /data/downloads/releases used to keep EVERY version ever shipped. On 2026-09-04 that was 235
#   packages and 46G against a live feed referencing 5 assets, the box's disk hit 100%, Postgres
#   went read-only and the whole site 500'd. So after a successful upload this workflow deletes
#   the packages nothing can reach: it keeps every asset the three PUBLIC feed manifests
#   reference, plus the 3 newest versions per channel, plus every manifest and every file it
#   cannot positively classify as a package, and deletes the rest. It prunes ALL THREE channels
#   (win/linux/osx), so whichever platform ships last tidies the whole directory, and it prints
#   the keep summary and the exact delete list before deleting anything.
#   Sibling: the Windows ship path never runs a workflow at all, so its own copy of this
#   retention lives in ship-client.ps1 (the superrepo). The step here is byte-identical to
#   build-linux.yml's, deliberately: it runs entirely on the deploy box, so the runner's
#   BSD/GNU differences never reach it.
#   Set the workflow_dispatch input `prune` to false to skip it for one run.
# ---------------------------------------------------------------------------------------------

name: Build & Deploy (macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (yyyy.Mdd.r, e.g. 2026.722.0)"
        required: true
        type: string
      prune:
        description: "Prune old packages from the release feed after uploading (see RETENTION)"
        required: false
        default: true
        type: boolean

concurrency: production-macos-deploy

env:
  DEPLOY_HOST: 46.62.142.5
  DEPLOY_USER: root
  APP_CONTAINER: typebeat-web-app-1
  # Stable download name so TYPEBEAT_GAME_DOWNLOAD_MACOS is set once (see header).
  PKG_NAME: typebeat-macos.pkg
  # Reverse-DNS CFBundleIdentifier for the .app. Arbitrary while unsigned, but it is what
  # macOS keys per-app state (window state, TCC prompts) on, so it must never change.
  BUNDLE_ID: sh.mingda.typebeat
  VPK_VERSION: "0.0.1298"   # MUST match the Velopack lib version in typebeat.Desktop.csproj.

jobs:
  build-deploy-macos:
    # macos-latest is Apple Silicon, so this both publishes osx-arm64 natively and gives us
    # sips/iconutil for the .icns (see the icon step). 10x minute multiplier, see header.
    runs-on: macos-latest

    steps:
      - name: Validate version input
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]{4}\.[0-9]{1,2}[0-9]{2}\.[0-9]+$' \
            || { echo "::error::version must be yyyy.Mdd.r (e.g. 2026.722.0)"; exit 1; }

      - uses: actions/checkout@v4

      # typebeat.Game references typebeat.Game.Resources (art/audio/fonts, ~116 MB), which is not on
      # nuget.org and is not a submodule here. The game's nuget.config expects it in a sibling
      # ../type-beat-assets/artifacts feed, so clone the assets repo to exactly that sibling path and
      # pack the package at the version the game csproj pins, then restore just works, unchanged.
      - name: Clone assets repo (typebeat.Game.Resources source)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/Sparpp/type-beat-assets.git" \
            "${GITHUB_WORKSPACE}/../type-beat-assets"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack typebeat.Game.Resources into the local feed
        run: |
          # sed (not grep -P) for locale portability, and because macOS ships BSD sed with no -P
          # at all; this substitution is plain POSIX BRE so it behaves the same as on the Linux
          # runner. Guard the empty match, an empty -p:Version fails the pack with an opaque MSB4044.
          VER=$(sed -n 's/.*Include="typebeat.Game.Resources" Version="\([^"]*\)".*/\1/p' typebeat.Game/typebeat.Game.csproj)
          if [ -z "$VER" ]; then echo "::error::could not read typebeat.Game.Resources version from the game csproj"; exit 1; fi
          echo "game requires typebeat.Game.Resources $VER"
          dotnet pack ../type-beat-assets/typebeat.Game.Resources/typebeat.Game.Resources.csproj \
            -c Release -o ../type-beat-assets/artifacts -p:PackageVersion="$VER" -p:Version="$VER"

      # Identical to build-linux.yml's step, and for the identical reason: the cause is structural,
      # not platform-specific. typebeat.Desktop/Bundled/ is gitignored (non-redistributable audio),
      # so a fresh actions/checkout has no such directory, the csproj glob matches nothing, and the
      # publish carries no maps while NOTHING FAILS. Populate it from the committed manifest before
      # the publish, or abort. The script is portable to this runner on purpose (bash 3.2, BSD
      # userland: no sha256sum, no GNU stat).
      - name: Fetch the bundled beatmaps
        run: bash .github/scripts/bundled-maps.sh fetch

      - name: Publish osx-arm64 (self-contained)
        run: |
          dotnet publish typebeat.Desktop -c Release -r osx-arm64 --self-contained \
            -p:Version="${{ inputs.version }}" -o "${GITHUB_WORKSPACE}/publish-macos"
          # Same guard build-linux.yml puts on its apphost: the SDK emits an extensionless apphost
          # that keeps the AssemblyName verbatim, '!' included. APFS is fine with '!' in a file
          # name and non-interactive bash does no history expansion, so the character survives,
          # but assert it rather than trust it, everything downstream (--mainExe, CFBundleExecutable)
          # is keyed off this exact name.
          test -f "${GITHUB_WORKSPACE}/publish-macos/type!beat" \
            || { echo "::error::expected apphost 'type!beat' not found in publish output"; ls "${GITHUB_WORKSPACE}/publish-macos"; exit 1; }
          # End-to-end check on the fetch step AND on the csproj glob: the fetch can succeed and
          # the maps still not reach the publish output if that ItemGroup ever regresses.
          want=$(bash .github/scripts/bundled-maps.sh count)
          got=$(find "${GITHUB_WORKSPACE}/publish-macos/Bundled" -maxdepth 1 -name '*.typb' 2>/dev/null | wc -l | tr -d ' ')
          test "$got" = "$want" \
            || { echo "::error::publish output carries ${got} bundled .typb, the manifest declares ${want}"; ls -la "${GITHUB_WORKSPACE}/publish-macos/Bundled" || true; exit 1; }
          echo "publish carries ${got} bundled beatmaps"
          # Same assertion build-linux.yml makes, for the same reason: the lyriclab aligner scripts
          # ship beside the exe and LyricMapImportService.InstallAsync copies them out of here, so
          # their absence is another silent dead button rather than a build failure.
          for f in lyriclab/align_lyrics.py lyriclab/setup.sh; do
            test -f "${GITHUB_WORKSPACE}/publish-macos/$f" \
              || { echo "::error::publish output is missing $f"; ls -la "${GITHUB_WORKSPACE}/publish-macos/lyriclab" || true; exit 1; }
          done
          echo "publish carries the lyriclab aligner scripts"

      # The repo carries the app art only as assets/lazer.png (1024x1024). vpk on macOS wants an
      # .icns for the bundle icon, and an .icns can only be assembled by iconutil, which ships with
      # macOS and has no Windows equivalent, so it cannot be generated on the dev box and checked
      # in. Build it here on the runner instead. Sizes are the set iconutil expects; 512@2x is 1024,
      # exactly the source resolution, so nothing is ever upscaled.
      - name: Build the .icns bundle icon from assets/lazer.png
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/assets/lazer.png"
          ICONSET="${RUNNER_TEMP}/lazer.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" "$SRC" --out "$ICONSET/icon_${sz}x${sz}.png" > /dev/null
            sips -z "$((sz * 2))" "$((sz * 2))" "$SRC" --out "$ICONSET/icon_${sz}x${sz}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "${RUNNER_TEMP}/lazer.icns"
          test -s "${RUNNER_TEMP}/lazer.icns" \
            || { echo "::error::iconutil produced no .icns from assets/lazer.png"; exit 1; }
          ls -la "${RUNNER_TEMP}/lazer.icns"

      - name: Install Velopack CLI (vpk)
        run: |
          dotnet tool install -g vpk --version "${VPK_VERSION}"
          echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"

      # vpk's macOS option surface could not be verified from the (Windows) dev box, so dump it
      # into the log unconditionally. If the pack step below dies on an unrecognised option, this
      # is the step whose output says what to use instead.
      - name: Record the vpk option surface
        run: vpk pack --help || true

      # vpk on a macOS host structures the publish output into a 'type!beat.app' bundle and emits:
      # the .pkg installer, a full package (*-osx-full.nupkg) and the osx-channel feed manifest
      # (releases.osx.json / assets.osx.json). Those *.osx.* names never collide with the Windows
      # or Linux feed files already in the same directory, so the whole feed lives side by side
      # under /data/downloads/releases/. mainExe is the extensionless apphost name; packId
      # 'typebeat' matches the SimpleWebSource the installed game polls
      # (https://typebeat.mingda.sh/releases).
      - name: Pack with Velopack
        run: |
          vpk pack \
            --packId typebeat \
            --packVersion "${{ inputs.version }}" \
            --packDir "${GITHUB_WORKSPACE}/publish-macos" \
            --mainExe "type!beat" \
            --packTitle "type!beat" \
            --bundleId "${BUNDLE_ID}" \
            --icon "${RUNNER_TEMP}/lazer.icns" \
            --outputDir "${GITHUB_WORKSPACE}/release-macos"
          echo "---- vpk output ----"
          ls -la "${GITHUB_WORKSPACE}/release-macos"

      # build-linux.yml can assert its '!' survived by stat-ing the apphost, because the AppImage
      # IS the apphost. Here the name has to survive two more hops (the .app bundle directory name
      # and CFBundleExecutable inside Info.plist), and both are buried in the .pkg payload, so
      # expand it and look. A silently mangled name would ship an installer that lands an app which
      # cannot launch, which is much worse to discover from a user report.
      - name: Verify the '!' survived into the bundle
        run: |
          set -euo pipefail
          # nullglob rather than `ls *.pkg`: under `set -e` a non-matching glob would abort the
          # step on ls's exit status before the error message below could explain why.
          shopt -s nullglob
          pkgs=("${GITHUB_WORKSPACE}"/release-macos/*.pkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::vpk produced no .pkg (check the 'Record the vpk option surface' step for what this vpk version emits)"
            ls -la "${GITHUB_WORKSPACE}/release-macos"
            exit 1
          fi
          PKG="${pkgs[0]}"
          echo "inspecting $PKG"
          EXPANDED="${RUNNER_TEMP}/pkg-expanded"
          rm -rf "$EXPANDED"
          pkgutil --expand-full "$PKG" "$EXPANDED"
          APP=$(find "$EXPANDED" -type d -name 'type!beat.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::no 'type!beat.app' in the pkg payload (the '!' was mangled, or the bundle is named differently)"
            find "$EXPANDED" -maxdepth 6 -name '*.app'
            exit 1
          fi
          echo "bundle: $APP"
          test -f "$APP/Contents/MacOS/type!beat" \
            || { echo "::error::Contents/MacOS/type!beat missing"; ls -la "$APP/Contents/MacOS"; exit 1; }
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          if [ "$EXE" != 'type!beat' ]; then
            echo "::error::CFBundleExecutable is '$EXE', expected 'type!beat'"
            exit 1
          fi
          echo "bundle name, executable and CFBundleExecutable all keep the '!' verbatim"

          # The bundled maps have to survive one more hop than they do on Linux, where the publish
          # dir IS the payload. The game looks for Bundled/ under RuntimeInfo.StartupDirectory,
          # which for a .app is Contents/MacOS, so that is where vpk must have put it. Asserted,
          # not assumed: this is the platform where the payload silently vanishing has already
          # happened once, and the pkg is expanded here anyway so the check is free.
          WANT=$(bash .github/scripts/bundled-maps.sh count)
          GOT=$(find "$APP/Contents/MacOS/Bundled" -maxdepth 1 -name '*.typb' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the installed app carries ${GOT} bundled .typb under Contents/MacOS/Bundled, the manifest declares ${WANT}"
            echo "if vpk placed the directory elsewhere in the bundle, it is listed below; fix this path rather than dropping the check"
            find "$APP" -type d -name Bundled
            exit 1
          fi
          echo "installed app carries ${GOT} bundled beatmaps under Contents/MacOS/Bundled"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Key travels as single-line base64 (see header); validate the decoded key up front so a
          # bad secret fails loudly here rather than as an opaque auth error mid-deploy.
          # NOTE: -D, not GNU's -d. macOS ships BSD base64, where -D is the portable decode flag.
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -D > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "deploy key parses OK"
          # Pin the box's host key (copied from typebeat-web/deploy/known_hosts) so the connection
          # is not vulnerable to a first-use MITM.
          echo "46.62.142.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrS4lA2m05VkJuLeaodsTV42Co8p0GWCE+NeeA9Wb7E" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Ship the artifacts to a scratch dir on the box, then land them inside the app container's
      # /data volume with docker cp + an in-container atomic mv (rename within the same dir), so a
      # download or an updater poll never observes a half-written file. The .pkg is renamed to the
      # stable PKG_NAME (the /download button's fixed target); feed files keep their
      # versioned/channel names and accumulate under releases/.
      - name: Deploy to production
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST}"
          SCP="scp -i ~/.ssh/deploy_key"
          REMOTE_TMP="/tmp/typebeat-macos-${{ inputs.version }}"

          $SSH "rm -rf ${REMOTE_TMP} && mkdir -p ${REMOTE_TMP}"
          $SCP "${GITHUB_WORKSPACE}"/release-macos/* "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_TMP}/"

          # Land the installer under its stable name in /data/downloads/.
          PKG=$(basename "$(ls "${GITHUB_WORKSPACE}"/release-macos/*.pkg | head -n1)")
          $SSH "set -e
            docker exec ${APP_CONTAINER} mkdir -p /data/downloads/releases
            docker cp '${REMOTE_TMP}/${PKG}' ${APP_CONTAINER}:/data/downloads/.incoming-${PKG_NAME}
            docker exec ${APP_CONTAINER} mv -f /data/downloads/.incoming-${PKG_NAME} /data/downloads/${PKG_NAME}
            echo 'pkg deployed as ${PKG_NAME}'"

          # Land every feed asset (releases.osx.json, assets.osx.json, *.nupkg, the portable zip if
          # vpk made one) into /data/downloads/releases/ with the same temp-then-atomic-mv dance.
          # The .pkg is a download artifact, not a feed asset, so it is excluded here.
          for f in "${GITHUB_WORKSPACE}"/release-macos/*; do
            b=$(basename "$f")
            case "$b" in *.pkg) continue;; esac
            $SSH "set -e
              docker cp '${REMOTE_TMP}/${b}' ${APP_CONTAINER}:/data/downloads/releases/.incoming-${b}
              docker exec ${APP_CONTAINER} mv -f '/data/downloads/releases/.incoming-${b}' '/data/downloads/releases/${b}'
              echo 'feed asset deployed: ${b}'"
          done

          $SSH "rm -rf ${REMOTE_TMP}"
          echo "macOS release ${{ inputs.version }} deployed."

      # RETENTION. /data/downloads/releases accumulated EVERY version ever shipped and filled the
      # box's disk on 2026-09-04: 235 packages, 46G, while the live feeds referenced 5 assets.
      # Postgres went read-only and every page 500'd, so this is not housekeeping. Every ship now
      # prunes, and prunes ALL THREE channels, so whichever platform ships last tidies the whole
      # directory. Delete-list-first: the keep summary and the exact delete list are printed to this
      # log BEFORE anything is removed, and only *.nupkg names the script can fully parse are ever
      # handed to rm. continue-on-error because the release is already live by the time this runs:
      # a prune that cannot run must be loud, not red. Opt out with the workflow's `prune` input:
      # the guard reads `inputs.prune` (typed) and NOT `github.event.inputs.prune`, which is always
      # a string, where the opt-out value "false" would be truthy and the step would run anyway.
      - name: Prune release feed
        if: ${{ inputs.prune }}
        continue-on-error: true
        run: |
          set -uo pipefail
          SSH="ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST}"
          FEED_BASE="https://typebeat.mingda.sh/releases"

          # The keep-set's first half comes from the PUBLIC manifests, which is what an installed
          # client actually resolves, rather than from anything on the box. curl runs here on the
          # runner: the box reaching its own public hostname is a hairpin question nobody needs to
          # answer. An HTTP error is a channel that has never shipped, and contributes nothing. Any
          # OTHER curl failure is not evidence of an empty feed, so it disarms the prune entirely.
          FEED_LIST=""
          FEED_OK=1
          for ch in win linux osx; do
            rc=0
            # `|| rc=$?` rather than a bare call: the runner's default shell is `bash -e`, where a
            # non-zero curl inside an assignment would abort the step before it could be handled.
            body=$(curl -fsSL --max-time 60 "${FEED_BASE}/releases.${ch}.json") || rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 22 ]; then
                echo "feed releases.${ch}.json: HTTP error, treating the channel as empty"
              else
                echo "::warning::feed releases.${ch}.json: curl exit ${rc}"
                FEED_OK=0
              fi
              continue
            fi
            names=$(printf '%s' "$body" | grep -o '"FileName"[[:space:]]*:[[:space:]]*"[^"]*"' \
              | sed -e 's/.*"FileName"[[:space:]]*:[[:space:]]*"//' -e 's/"$//') || names=""
            echo "feed releases.${ch}.json references: $(printf '%s' "$names" | tr '\n' ' ')"
            FEED_LIST="${FEED_LIST}${names}"$'\n'
          done
          if [ "$FEED_OK" -ne 1 ]; then
            echo "::warning::the release feed could not be read in full, SKIPPING the prune. Nothing was deleted."
            exit 0
          fi
          FEED_B64=$(printf '%s' "${FEED_LIST}" | base64 | tr -d '\n')

          # Everything below runs ON THE BOX (GNU coreutils, so sort -V and xargs -d behave the same
          # for both platforms' runners) and is byte-identical in build-linux.yml and build-macos.yml.
          $SSH "APP_CONTAINER='${APP_CONTAINER}' FEED_B64='${FEED_B64}' KEEP_VERSIONS=3 bash -s" <<'PRUNE'
          set -u
          REL="${REL:-/data/downloads/releases}"
          KEEP_N="${KEEP_VERSIONS:-3}"
          # The releases dir lives INSIDE the app container (named volume), so every list and every
          # delete goes through docker exec. DEX is the seam that makes this logic runnable against a
          # plain local fixture directory: unset in CI, set to empty when testing.
          DEX="${DEX-docker exec ${APP_CONTAINER}}"
          NL=$'\n'
          echo "== prune release feed =="
          echo "dir: ${REL}   policy: keep feed-referenced + the ${KEEP_N} newest versions per channel"

          # Half one of the keep-set: the names the runner read off the PUBLIC manifests, handed down
          # base64'd on a single line so it crosses the ssh command string without quoting games.
          feed=$(printf '%s' "${FEED_B64:-}" | base64 -d 2>/dev/null | sed '/^$/d')
          if [ -z "${feed}" ]; then
            echo "::warning::no feed-referenced assets resolved, refusing to prune (a fetch failure must never look like an empty feed)"
            exit 0
          fi

          # -A so a half-landed .incoming-* upload from an aborted deploy is visible in this log as
          # something the prune saw and kept, instead of being invisible to it.
          listing=$(${DEX} ls -1A "${REL}" 2>/dev/null | tr -d '\r' | sed '/^$/d')
          if [ -z "${listing}" ]; then
            echo "::warning::could not list ${REL}, nothing pruned"
            exit 0
          fi

          # Newline-delimited membership test. No arrays, no subshells, no dependence on IFS.
          in_list() {
            case "${NL}$2${NL}" in *"${NL}$1${NL}"*) return 0 ;; esac
            return 1
          }

          # Velopack names packages <packId>-<version>[-<channel>]-{full,delta}.nupkg, and THE CHANNEL
          # SEGMENT IS ABSENT ON WIN: the live feed serves typebeat-2026.903.0-full.nupkg for Windows but
          # typebeat-2026.903.0-linux-full.nupkg / -osx-full.nupkg for the other two (checked against the
          # three public manifests). So an unsuffixed name is win. Do not "fix" that without re-reading
          # the manifests. Anything this cannot fully parse is not a package as far as the prune is
          # concerned: it is kept and listed.
          classify() {
            CH=""; VER=""
            case "$1" in .*) return 1 ;; esac
            case "$1" in *.nupkg) ;; *) return 1 ;; esac
            stem=${1%.nupkg}
            case "${stem}" in
              typebeat-*-full)  stem=${stem%-full} ;;
              typebeat-*-delta) stem=${stem%-delta} ;;
              *) return 1 ;;
            esac
            rest=${stem#typebeat-}
            case "${rest}" in
              *-win)   CH=win;   VER=${rest%-win} ;;
              *-linux) CH=linux; VER=${rest%-linux} ;;
              *-osx)   CH=osx;   VER=${rest%-osx} ;;
              *)       CH=win;   VER=${rest} ;;
            esac
            case "${VER}" in ""|*[!0-9.]*) return 1 ;; esac
            return 0
          }

          # Pass 1: bucket every package by channel, and collect what cannot be classified.
          vers_win=""; vers_linux=""; vers_osx=""; unclassified=""
          while IFS= read -r f; do
            if classify "${f}"; then
              case "${CH}" in
                win)   vers_win="${vers_win}${VER}${NL}" ;;
                linux) vers_linux="${vers_linux}${VER}${NL}" ;;
                osx)   vers_osx="${vers_osx}${VER}${NL}" ;;
              esac
            else
              unclassified="${unclassified}${f}${NL}"
            fi
          done <<LISTING
          ${listing}
          LISTING

          # Half two of the keep-set. N is a JUDGEMENT CALL, not a code-derived constant: 3 is what the
          # 2026-09-04 disk recovery kept by hand, and it covers the delta chain a recent client walks.
          # A client older than the window is not broken by a prune, it falls back to the newest Full
          # package (always feed-referenced, so always kept) and takes a full download instead of a delta.
          newest() { printf '%s' "$1" | sed '/^$/d' | sort -u | sort -V | tail -n "${KEEP_N}"; }
          keep_win=$(newest "${vers_win}")
          keep_linux=$(newest "${vers_linux}")
          keep_osx=$(newest "${vers_osx}")

          # Pass 2: sort every file into keep-with-a-reason or delete. Nothing is deleted in this pass.
          keep_feed=""; keep_recent=""; to_delete=""
          while IFS= read -r f; do
            if in_list "${f}" "${feed}"; then
              keep_feed="${keep_feed}${f}${NL}"
            elif ! classify "${f}"; then
              :
            else
              case "${CH}" in
                win)   keepset="${keep_win}" ;;
                linux) keepset="${keep_linux}" ;;
                osx)   keepset="${keep_osx}" ;;
              esac
              if in_list "${VER}" "${keepset}"; then
                keep_recent="${keep_recent}${f}${NL}"
              else
                to_delete="${to_delete}${f}${NL}"
              fi
            fi
          done <<LISTING
          ${listing}
          LISTING

          count() { printf '%s' "$1" | sed '/^$/d' | wc -l | tr -d ' '; }
          echo
          echo "-- KEEP, referenced by a live feed manifest ($(count "${keep_feed}")):"
          printf '%s' "${keep_feed}" | sed 's/^/   /'
          echo "-- KEEP, within the ${KEEP_N} newest versions of its channel ($(count "${keep_recent}")):"
          printf '%s' "${keep_recent}" | sed 's/^/   /'
          echo "   win:   $(printf '%s' "${keep_win}" | tr '\n' ' ')"
          echo "   linux: $(printf '%s' "${keep_linux}" | tr '\n' ' ')"
          echo "   osx:   $(printf '%s' "${keep_osx}" | tr '\n' ' ')"
          echo "-- KEEP, manifests and anything not classifiable as a package ($(count "${unclassified}")):"
          printf '%s' "${unclassified}" | sed 's/^/   /'
          echo "-- DELETE, unreferenced packages older than the window ($(count "${to_delete}")):"
          printf '%s' "${to_delete}" | sed 's/^/   /'
          echo
          if [ -z "${to_delete}" ]; then
            echo "nothing to prune."
            exit 0
          fi
          ${DEX} du -sh "${REL}" 2>/dev/null || true

          # The one irreversible line in this workflow. The safe pattern is re-asserted here rather than
          # trusted from the pass above, so this block can be read on its own: a plain *.nupkg name, no
          # dotfile, no path separator, or it is refused and reported.
          printf '%s\n' "${to_delete}" | sed '/^$/d' | while IFS= read -r f; do
            case "${f}" in
              .*|*/*)  echo "::warning::refusing to delete '${f}' (not a plain package name)"; continue ;;
              *.nupkg) printf '%s\n' "${REL}/${f}" ;;
              *)       echo "::warning::refusing to delete '${f}' (not a .nupkg)"; continue ;;
            esac
          done | xargs -r -d '\n' -n 50 ${DEX} rm -f --
          echo "pruned $(count "${to_delete}") package(s)."
          ${DEX} du -sh "${REL}" 2>/dev/null || true
          PRUNE
